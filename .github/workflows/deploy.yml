name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Add any public build-time env vars here (non-secret)
          NODE_ENV: production
          VITE_API_URL: https://api.scrapco.in
          VITE_SUPABASE_URL: https://mtzvoeohbifxmertnwwy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_hqVgHskOyz-dcyMVG0kURg_Yin7El1X
          # Sentry: set the DSN as a repository variable and the auth token as a
          # secret (Settings → Secrets and variables → Actions). Both optional;
          # without them error tracking and source-map upload are skipped.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Remove source maps from the public bundle
        run: find dist/client -name '*.map' -print -delete

      - name: Deploy via Wrangler
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Wrangler reads this to know which account to deploy to
          CLOUDFLARE_ACCOUNT_ID: 757a6978f0485ed3fa48d8d0c413403d
